name: Release Nodus

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release tag to create or update
        required: true
        default: 0.0.1-alpha
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  test-windows:
    name: Test on Windows
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

  release:
    name: Build and publish ${{ inputs.version }}
    runs-on: ubuntu-latest
    needs: test-windows

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      - name: Build release archives
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist

          build_archive() {
            os="$1"
            arch="$2"
            extension="$3"
            archive_type="$4"
            name="nodus_${VERSION}_${os}_${arch}"

            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags='-s -w' -o "dist/nodus${extension}" ./cmd/nodus

            if [ "$archive_type" = "zip" ]; then
              (cd dist && zip -q "${name}.zip" "nodus${extension}")
            else
              tar -C dist -czf "dist/${name}.tar.gz" "nodus${extension}"
            fi
            rm "dist/nodus${extension}"
          }

          build_archive linux amd64 '' tar.gz
          build_archive linux arm64 '' tar.gz
          build_archive linux 386 '' tar.gz
          build_archive darwin amd64 '' tar.gz
          build_archive darwin arm64 '' tar.gz
          build_archive windows amd64 .exe zip
          build_archive windows arm64 .exe zip

          (cd dist && sha256sum *.tar.gz *.zip > checksums.txt)

      - name: Create or update prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          title="Nodus ${VERSION}"
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release edit "$VERSION" --title "$title" --prerelease
          else
            gh release create "$VERSION" \
              --target "$GITHUB_SHA" \
              --title "$title" \
              --prerelease \
              --generate-notes
          fi
          gh release upload "$VERSION" dist/* --clobber
